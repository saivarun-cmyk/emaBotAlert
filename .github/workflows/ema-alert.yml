name: EMA20 Alert

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '45-59/5 3 * * 1-5'   # 3:45, 3:50, 3:55 UTC → 9:15, 9:20, 9:25 AM IST
    - cron: '*/5 4-9 * * 1-5'     # every 5 min from 4:00 to 9:55 UTC → 9:30 AM to 3:25 PM IST
    - cron: '0 10 * * 1-5'        # 10:00 UTC → 3:30 PM IST (final candle)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run EMA check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ema_alert.py

      - name: Commit updated state
        run: |
          git config user.name "ema-bot"
          git config user.email "ema-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
