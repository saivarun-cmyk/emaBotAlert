name: EMA20 Alert

on:
  schedule:
    # every 5 min, 3:00-10:55 UTC (covers NSE 9:15-15:30 IST), Mon-Fri
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: {}   # lets you trigger it manually to test

permissions:
  contents: write

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run EMA check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ema_alert.py

      - name: Commit updated state
        run: |
          git config user.name "ema-bot"
          git config user.email "ema-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push